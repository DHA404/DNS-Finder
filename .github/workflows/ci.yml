name: CI

# Runs on every push and pull request: formatting, vet, the full test suite with
# the race detector, and a cross-compile matrix.
#
# Releases are cut manually with goreleaser (see .goreleaser.yml), so there is
# no tag-triggered publish job here.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Cancel a superseded run on the same ref: a queued build of an older commit
# tells nobody anything once a newer one exists.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary target and the one most likely to break (path
        # separators, console handling, the atomic settings write), so it gets a
        # first-class runner rather than being left to the cross-compile job
        # below, which never executes the binary.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        if: runner.os == 'Linux'
        shell: bash
        run: |
          unformatted="$(gofmt -l . | grep -v '^\.example/' || true)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

      - name: go test -race
        # The race detector needs cgo; windows-latest and macos-latest runners
        # have a working toolchain, so this runs everywhere except where it is
        # known to be flaky (none today).
        run: go test -race ./...

  cross-compile:
    name: cross-compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o /dev/null ./cmd/dns-opti

  nodoh3:
    name: build tag nodoh3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The nodoh3 tag drops the QUIC dependency, so it must keep compiling and
      # its tests must keep passing: it is the documented escape hatch for
      # platforms where DoH3 cannot be built.
      - name: build + test with nodoh3
        env:
          CGO_ENABLED: "0"
        run: |
          go build -tags nodoh3 ./...
          go test -tags nodoh3 ./...
